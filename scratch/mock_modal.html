<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup Verification 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dist/assets/index-CFUHWmyL.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 50%, #111e38 0%, #080f1e 100%);
      font-family: 'Open Sans', 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .modal-overlay {
      position: relative;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      width: 100%;
    }
    .modal-content.profile-edit-modal {
      width: 100%;
      max-width: 910px;
      background: rgba(16, 24, 48, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="modal-overlay">
    <div class="modal-content profile-edit-modal">
      <div class="modal-header">
        <h3>Edit Professional Profile</h3>
        <button class="close-btn">×</button>
      </div>

      <div class="modal-body">
        <div class="services-section">
          <h4>Services & Pricing</h4>
          
          <div class="modal-services-list">
            <!-- Expanded Service Card -->
            <div class="service-card">
              <div class="service-header">
                <h5>Hair Services</h5>
                <div class="service-actions">
                  <button class="btn-expand-neon">
                    0 variants ∧
                  </button>
                  <button class="btn-delete-svc-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: middle;"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    Delete
                  </button>
                </div>
              </div>

              <!-- Expanded Variants Section -->
              <div class="service-content" style="padding: 20px;">
                <p class="section-hint">No variants yet. Add one below.</p>
                
                <!-- Add Variant Form -->
                <div class="add-variant-box">
                  <h6>Add Variant to Hair Services</h6>
                  
                  <div class="variant-form-vertical">
                    <!-- Form inputs (80% width) -->
                    <div class="variant-form-fields-80">
                      <div class="form-group">
                        <label>Variant Name *</label>
                        <input type="text" placeholder="e.g., Swedish Massage, Deep Tissue" value="Hair Services">
                      </div>

                      <div class="form-row">
                        <div class="form-group">
                          <label>Price (£) *</label>
                          <input type="number" class="price-input-no-spin" placeholder="0.00" value="45.00">
                        </div>
                        <div class="form-group">
                          <label>Duration (minutes)</label>
                          <select>
                            <option value="15">15 mins</option>
                            <option value="30">30 mins</option>
                            <option value="45">45 mins</option>
                            <option selected value="60">60 mins (1 hr)</option>
                            <option value="75">75 mins</option>
                            <option value="90">90 mins (1.5 hrs)</option>
                          </select>
                        </div>
                      </div>

                      <div class="form-group">
                        <label>Description</label>
                        <textarea placeholder="Describe this variant..." rows="3">A high-quality hair styling service with custom washing, blow dry, and specialized treatments.</textarea>
                      </div>
                    </div>

                    <!-- Bottom Right Actions -->
                    <div class="variant-form-actions-bottom">
                      <button type="button" class="btn-delete-variant-form">
                        Delete Variant
                      </button>
                      <button type="button" class="btn-add-variant">
                        Add Variant
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            </div>
            
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary">Cancel</button>
        <button class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

</body>
</html>
